services:
  weaviate:
    command:
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --scheme
      - http
    image: semitechnologies/weaviate:1.32.4
    ports:
      # Bound to this machine only. Change to "8085:8080" to expose on the network.
      - "127.0.0.1:8085:8080"
      - "127.0.0.1:50056:50051"
    restart: on-failure:0
    volumes:
      - weaviate_oxcart_data:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'text2vec-openai'
      ENABLE_MODULES: 'text2vec-openai'
      CLUSTER_HOSTNAME: 'oxcart'
      ENABLE_API_BASED_MODULES: 'true'
      # Read from the repo-root .env (optional: only needed for hybrid search and indexing)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
volumes:
  weaviate_oxcart_data:

# Weaviate for local use. Data persists in the named volume above.
#
#   1. (optional) put OPENAI_API_KEY in .env at the repo root
#   2. docker compose up -d
#   3. check: curl http://127.0.0.1:8085/v1/meta
#   4. stop:  docker compose down
#
# CLUSTER_HOSTNAME must stay 'oxcart' when the volume holds a restored export.
